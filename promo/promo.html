<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fits Promo</title>
<style>
  html, body { margin: 0; background: #0b0b0c; color: #ddd; font: 14px system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; }
  canvas { height: calc(100vh - 90px); aspect-ratio: 9 / 16; background: #000; border-radius: 12px; }
  #ui { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  body.render #ui { display: none; }
  body.render #wrap { padding: 0; }
  body.render canvas { height: auto; width: 1080px; border-radius: 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="ui">
    <button id="play">Play</button>
    <input id="scrub" type="range" min="0" max="31" step="0.01" value="0" style="width:320px">
    <span id="time">0.00s</span>
    <label>Song <input id="song" type="file" accept="audio/*"></label>
    <label>Song start (s) <input id="off" type="number" value="0" step="0.1" style="width:64px"></label>
  </div>
</div>
<script>
const W = 1080, H = 1920, FPS = 30, DUR = 31;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = '"Arial Black","Segoe UI Black",Impact,sans-serif';
const UI = '"Segoe UI",system-ui,sans-serif';
const C = {
  ink: '#15161a', lime: '#c6ff3d', dark: '#111214', skin: '#f4c39d', hair: '#2a1c14',
  drab: '#8b9099', shorts: '#2c3a55', shoe: '#eef0f3', bar: '#c9ced6',
  drag: '#7b4bd6', dragD: '#5a32a8', belly: '#ffc078', horn: '#f1e3c6', mouth: '#5a0f1f',
};
const TAU = Math.PI * 2;

// ---------- math ----------
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const eBounce = x => {
  const n = 7.5625, d = 2.75;
  if (x < 1 / d) return n * x * x;
  if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
  if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375;
  return n * (x -= 2.625 / d) * x + .984375;
};
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// ---------- drawing primitives ----------
function paint(fill, stroke, lw) {
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function circle(x, y, r, fill, stroke, lw = 6) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); paint(fill, stroke, lw); }
function ellipse(x, y, rx, ry, fill, stroke, lw = 6) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); paint(fill, stroke, lw); }
function rrect(x, y, w, h, r, fill, stroke, lw = 6) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); paint(fill, stroke, lw); }
function path(pts, close = true) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  if (close) ctx.closePath();
}
function poly(pts, fill, stroke, lw = 6) { path(pts); paint(fill, stroke, lw); }
function line(pts, w, color) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  path(pts, false); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
}
function limb(pts, w, color, ol = 7) { line(pts, w + ol * 2, C.ink); line(pts, w, color); }
function text(s, x, y, size, color, o = {}) {
  ctx.save();
  ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  if (o.scale != null) ctx.scale(o.scale, o.scale);
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.font = `${o.weight || 900} ${size}px ${o.font || FONT}`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  if (o.stroke !== false) {
    ctx.lineJoin = 'round'; ctx.strokeStyle = o.strokeColor || C.ink;
    ctx.lineWidth = size * (o.sw || 0.22); ctx.strokeText(s, 0, 0);
  }
  ctx.fillStyle = color; ctx.fillText(s, 0, 0);
  ctx.restore();
}
function burst(x, y, r, n, fill, rot = 0) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const a = rot + i * Math.PI / n, rr = i % 2 ? r * .62 : r;
    pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
  }
  poly(pts, fill, C.ink, 7);
}

// ---------- barbell ----------
const PLATE = { 45: { r: 80, t: 28, c: '#30333a' }, 25: { r: 64, t: 24, c: '#e0483f' }, 10: { r: 46, t: 18, c: '#3d7bd6' }, 5: { r: 34, t: 14, c: '#e8c547' } };
function plateList(w) {
  let rest = (w - 45) / 2; const out = [];
  for (const p of [45, 25, 10, 5]) while (rest >= p - .01) { out.push(p); rest -= p; }
  return out;
}
function drawBarbell(cx, cy, weight, { half = 230, bend = 0, rot = 0 } = {}) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  const bar = () => { ctx.beginPath(); ctx.moveTo(-half - 60, bend); ctx.quadraticCurveTo(0, -bend, half + 60, bend); };
  ctx.lineCap = 'round';
  bar(); ctx.strokeStyle = C.ink; ctx.lineWidth = 24; ctx.stroke();
  bar(); ctx.strokeStyle = C.bar; ctx.lineWidth = 11; ctx.stroke();
  const plates = plateList(weight);
  for (const side of [-1, 1]) {
    const y = bend * .8;
    rrect(side * (half - 22) - 7, y - 22, 14, 44, 4, '#9aa0aa', C.ink, 5);
    let off = half - 10;
    for (const p of plates) {
      const pl = PLATE[p];
      const x = side * (off + pl.t / 2);
      rrect(x - pl.t / 2, y - pl.r, pl.t, pl.r * 2, 7, pl.c, C.ink, 5);
      off += pl.t + 3;
    }
  }
  ctx.restore();
}

// ---------- hero ----------
function ik(sx, sy, hx, hy, a, b, side, mode) {
  const dx = hx - sx, dy = hy - sy;
  const d = clamp(Math.hypot(dx, dy), 1, a + b - .5);
  const ang = Math.atan2(dy, dx);
  const A = Math.acos(clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1));
  const e1 = [sx + Math.cos(ang + A) * a, sy + Math.sin(ang + A) * a];
  const e2 = [sx + Math.cos(ang - A) * a, sy + Math.sin(ang - A) * a];
  if (mode === 'down') return e1[1] > e2[1] ? e1 : e2;
  return e1[0] * side > e2[0] * side ? e1 : e2;
}

function drawFace(f, x, y, t) {
  ctx.save(); ctx.translate(x, y);
  ctx.lineCap = 'round'; ctx.strokeStyle = C.ink; ctx.fillStyle = C.ink; ctx.lineWidth = 7;
  const eye = (ex, ey, r = 8) => { ctx.beginPath(); ctx.arc(ex, ey, r, 0, TAU); ctx.fillStyle = C.ink; ctx.fill(); };
  const seg = (a, b, c, d) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); };
  if (f === 'sad') {
    eye(-22, 4); eye(22, 4);
    seg(-38, -14, -12, -24); seg(38, -14, 12, -24);
    ctx.beginPath(); ctx.arc(0, 46, 18, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  } else if (f === 'grit') {
    eye(-22, 2, 7); eye(22, 2, 7);
    seg(-38, -24, -12, -12); seg(38, -24, 12, -12);
    rrect(-24, 22, 48, 20, 6, '#fff', C.ink, 5);
    seg(-8, 23, -8, 41); seg(8, 23, 8, 41);
  } else if (f === 'determined') {
    eye(-22, 2); eye(22, 2);
    seg(-38, -22, -12, -12); seg(38, -22, 12, -12);
    ctx.beginPath(); ctx.moveTo(-16, 32); ctx.quadraticCurveTo(4, 36, 18, 26); ctx.stroke();
  } else if (f === 'wow') {
    circle(-22, 0, 13, '#fff', C.ink, 5); circle(22, 0, 13, '#fff', C.ink, 5);
    eye(-22, -3, 6); eye(22, -3, 6);
    seg(-38, -30, -12, -34); seg(38, -30, 12, -34);
    circle(0, 36, 12, '#7a1f2b', C.ink, 5);
  } else { // happy
    ctx.beginPath(); ctx.arc(-22, 6, 10, Math.PI, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(22, 6, 10, Math.PI, TAU); ctx.stroke();
    ellipse(-40, 22, 12, 7, 'rgba(255,90,90,.35)'); ellipse(40, 22, 12, 7, 'rgba(255,90,90,.35)');
    ctx.beginPath(); ctx.arc(0, 20, 24, 0, Math.PI); ctx.closePath(); paint('#7a1f2b', C.ink, 6);
  }
  ctx.restore();
}

// o: x,y,s,m(muscle 0..1),pose(press|hang|flex|throw),lift,slump,face,shirt,band,weight,bend,shake,lookUp,sweat,bob,t
function drawGuy(o) {
  const t = o.t || 0, m = o.m || 0, sl = o.slump || 0;
  ctx.save(); ctx.translate(o.x, o.y); ctx.scale(o.s, o.s);
  ellipse(0, 6, 150 + m * 40, 24, 'rgba(0,0,0,.28)');

  const hipY = -160, shY = -340 + sl * 40 + (o.bob || 0), shX = 50 + m * 46, hipX = 38 + m * 10, legW = 34 + m * 14;
  const lean = sl * 14;

  // legs, shoes, shorts
  limb([[-hipX + 10, hipY + 20], [-52, -14]], legW, C.skin);
  limb([[hipX - 10, hipY + 20], [52, -14]], legW, C.skin);
  rrect(-104, -36, 82, 40, 16, C.shoe, C.ink, 6);
  rrect(22, -36, 82, 40, 16, C.shoe, C.ink, 6);
  poly([[-hipX - 14, hipY - 14], [hipX + 14, hipY - 14], [hipX + 26, hipY + 72], [8, hipY + 72], [0, hipY + 42], [-8, hipY + 72], [-hipX - 26, hipY + 72]], C.shorts, C.ink, 6);

  // neck + torso
  rrect(-20 + lean, shY - 44, 40, 50, 12, C.skin, C.ink, 6);
  ctx.beginPath();
  ctx.moveTo(-hipX - 6, hipY);
  ctx.lineTo(-shX + lean, shY + 30);
  ctx.quadraticCurveTo(-shX + lean, shY - 4, -shX + 30 + lean, shY - 6);
  ctx.lineTo(shX - 30 + lean, shY - 6);
  ctx.quadraticCurveTo(shX + lean, shY - 4, shX + lean, shY + 30);
  ctx.lineTo(hipX + 6, hipY);
  ctx.closePath();
  paint(o.shirt || C.drab, C.ink, 7);
  if (m > .3) { // pecs + abs line
    ctx.save(); ctx.globalAlpha = clamp((m - .3) * 2) * .5; ctx.strokeStyle = C.ink; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-shX * .45 + lean, shY + 40, shX * .4, .2, Math.PI - .4); ctx.stroke();
    ctx.beginPath(); ctx.arc(shX * .45 + lean, shY + 40, shX * .4, .4, Math.PI - .2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lean, shY + 100); ctx.lineTo(lean * .5, hipY - 20); ctx.stroke();
    ctx.restore();
  }

  // head
  const hx = lean * 1.6, hy = shY - 80 + sl * 28;
  circle(hx - 64, hy + 6, 15, C.skin, C.ink, 6); circle(hx + 64, hy + 6, 15, C.skin, C.ink, 6);
  circle(hx, hy, 66, C.skin);
  ctx.save(); ctx.beginPath(); ctx.arc(hx, hy, 66, 0, TAU); ctx.clip();
  ellipse(hx, hy - 56, 84, 42, C.hair);
  if (o.band) { ctx.fillStyle = C.lime; ctx.fillRect(hx - 70, hy - 34, 140, 20); }
  ctx.restore();
  circle(hx, hy, 66, null, C.ink, 7);
  if (o.band) { // headband tails
    line([[hx + 60, hy - 24], [hx + 92, hy - 10 + Math.sin(t * 14) * 6]], 12, C.lime);
  }
  drawFace(o.face || 'determined', hx, hy + sl * 10 + (o.lookUp ? -10 : 0), t);
  if (o.sweat) {
    for (let i = 0; i < 3; i++) {
      const ph = (t * 1.6 + i / 3) % 1;
      const sx = hx + [-78, 80, 70][i], sy = hy - 30 + ph * 80;
      ctx.save(); ctx.globalAlpha = 1 - ph;
      ctx.beginPath(); ctx.moveTo(sx, sy - 16); ctx.quadraticCurveTo(sx + 11, sy + 2, sx, sy + 8); ctx.quadraticCurveTo(sx - 11, sy + 2, sx, sy - 16);
      paint('#8fd3ff', C.ink, 4); ctx.restore();
    }
  }

  // arms
  const aw = 28 + m * 24, al = 105;
  const shL = [-shX + 18 + lean, shY + 26], shR = [shX - 18 + lean, shY + 26];
  let hL, hR, mode = 'down', gx = shX + 44;
  if (o.pose === 'press') {
    const hy2 = lerp(shY + 10, shY - 185, o.lift || 0);
    hL = [-gx + lean, hy2]; hR = [gx + lean, hy2];
  } else if (o.pose === 'flex') {
    const pump = Math.sin(t * 8) * 8;
    hL = [-shX - 80, shY - 110 + pump]; hR = [shX + 80, shY - 110 + pump]; mode = 'out';
  } else if (o.pose === 'throw') {
    hL = [shX + 90, shY - 110]; hR = [shX + 160, shY - 80];
  } else {
    hL = [-shX - 20 + lean, hipY + 24]; hR = [shX + 20 + lean, hipY + 24]; mode = 'out';
  }
  if (o.shake) {
    const j = Math.sin(t * 90) * o.shake;
    hL = [hL[0], hL[1] + j]; hR = [hR[0], hR[1] - j];
  }
  const arms = [[shL, hL, -1], [shR, hR, 1]].map(([S, Hd, side]) => {
    const E = ik(S[0], S[1], Hd[0], Hd[1], al, al, side, mode);
    return { S, E, Hd, bx: lerp(S[0], E[0], .5), by: lerp(S[1], E[1], .5) - m * 6, br: aw * .5 + m * 16 };
  });
  for (const a of arms) { line([a.S, a.E, a.Hd], aw + 14, C.ink); circle(a.bx, a.by, a.br + 7, C.ink); }
  for (const a of arms) { line([a.S, a.E, a.Hd], aw, C.skin); circle(a.bx, a.by, a.br, C.skin); }

  if (o.weight && o.pose === 'press') {
    drawBarbell((hL[0] + hR[0]) / 2, (hL[1] + hR[1]) / 2, o.weight, { half: gx + 70, bend: o.bend || 0, rot: Math.atan2(hR[1] - hL[1], hR[0] - hL[0]) });
  }
  for (const a of arms) circle(a.Hd[0], a.Hd[1], aw * .62, C.skin, C.ink, 7);
  ctx.restore();
}

// ---------- props ----------
function gym(t, o = {}) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, o.top || '#2e3340'); g.addColorStop(1, o.bot || '#1f232c');
  ctx.fillStyle = g; ctx.fillRect(-60, -60, W + 120, H + 120);
  ctx.fillStyle = 'rgba(255,255,255,.035)';
  for (let i = 0; i < 7; i++) ctx.fillRect(i * 180 + 20, -60, 8, 1480);
  // mirror
  rrect(80, 520, 920, 580, 18, 'rgba(150,180,210,.10)', 'rgba(0,0,0,.4)', 12);
  ctx.save(); ctx.beginPath(); ctx.roundRect(80, 520, 920, 580, 18); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 50;
  for (const x of [220, 330, 760]) { ctx.beginPath(); ctx.moveTo(x, 500); ctx.lineTo(x - 300, 1120); ctx.stroke(); }
  ctx.restore();
  // dumbbell rack
  rrect(110, 1320, 860, 100, 10, '#15171c', C.ink, 6);
  for (let i = 0; i < 8; i++) {
    const x = 165 + i * 107, r = 18 + (i % 4) * 4;
    line([[x - 30, 1300], [x + 30, 1300]], 10, '#777d87');
    circle(x - 30, 1300, r, '#3a3e47', C.ink, 5); circle(x + 30, 1300, r, '#3a3e47', C.ink, 5);
  }
  // floor
  ctx.fillStyle = o.floor || '#17191f'; ctx.fillRect(-60, 1420, W + 120, H);
  ctx.fillStyle = '#0d0e11'; ctx.fillRect(-60, 1412, W + 120, 14);
  ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 4;
  for (let i = -6; i <= 6; i++) { ctx.beginPath(); ctx.moveTo(540 + i * 90, 1426); ctx.lineTo(540 + i * 330, H + 60); ctx.stroke(); }
}

function wallClock(x, y, t, speed) {
  circle(x, y, 70, '#f3f3f0', C.ink, 8);
  for (let i = 0; i < 12; i++) { const a = i * TAU / 12; line([[x + Math.cos(a) * 54, y + Math.sin(a) * 54], [x + Math.cos(a) * 60, y + Math.sin(a) * 60]], 4, C.ink); }
  const mA = t * speed * TAU - Math.PI / 2, hA = t * speed * TAU / 12 - Math.PI / 2;
  line([[x, y], [x + Math.cos(hA) * 32, y + Math.sin(hA) * 32]], 9, C.ink);
  line([[x, y], [x + Math.cos(mA) * 50, y + Math.sin(mA) * 50]], 6, '#e0483f');
  circle(x, y, 7, C.ink);
}

function rainCloud(x, y, a, t) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y);
  ctx.strokeStyle = '#7fb2ff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (let i = 0; i < 9; i++) {
    const ph = (t * 2.2 + hash(i)) % 1, rx = -112 + i * 28, ry = 30 + ph * 190;
    ctx.globalAlpha = a * (1 - ph);
    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 6, ry + 28); ctx.stroke();
  }
  ctx.globalAlpha = a;
  const blobs = [[-80, 10, 50], [-30, -20, 65], [40, -10, 58], [90, 15, 44], [0, 20, 55]];
  ctx.fillStyle = C.ink; blobs.forEach(([bx, by, r]) => { ctx.beginPath(); ctx.arc(bx, by, r + 7, 0, TAU); ctx.fill(); });
  ctx.fillStyle = '#8a93a3'; blobs.forEach(([bx, by, r]) => { ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fill(); });
  ctx.restore();
}

function thoughtChart(x, y, a, t) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const sc = eBack(clamp(a * 1.2)); ctx.translate(x, y); ctx.scale(sc, sc);
  circle(-170, 210, 14, '#fff', C.ink, 6); circle(-130, 165, 22, '#fff', C.ink, 6);
  rrect(-180, -120, 360, 250, 44, '#fff', C.ink, 8);
  text('MY PROGRESS', 0, -78, 30, C.ink, { stroke: false });
  line([[-130, -40], [-130, 90], [140, 90]], 6, '#9aa0aa');
  const pts = [];
  for (let i = 0; i <= 20; i++) pts.push([-120 + i * 12.5, 40 + Math.sin(i * 1.7 + t * 6) * 3]);
  line(pts, 8, '#ff5a5a');
  ctx.restore();
}

function logo(x, y, size, prog = 1, color = C.lime) {
  ctx.save(); ctx.translate(x, y); const k = size / 512; ctx.scale(k, k); ctx.translate(-256, -256);
  ctx.strokeStyle = color; ctx.lineWidth = 34; ctx.lineCap = 'round';
  const L = [[96, 256, 416, 256], [140, 176, 140, 336], [372, 176, 372, 336], [86, 206, 86, 306], [426, 206, 426, 306]];
  L.forEach((l, i) => {
    const pr = i === 0 ? eOut(P(prog, 0, .45)) : eBack(P(prog, .25 + i * .1, .6 + i * .1));
    if (pr <= 0) return;
    const mx = (l[0] + l[2]) / 2, my = (l[1] + l[3]) / 2;
    ctx.beginPath(); ctx.moveTo(lerp(mx, l[0], pr), lerp(my, l[1], pr)); ctx.lineTo(lerp(mx, l[2], pr), lerp(my, l[3], pr)); ctx.stroke();
  });
  ctx.restore();
}

function phone(cx, cy, w, h, scale, content) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(scale, scale);
  rrect(-w / 2 - 9, -h / 2 - 9, w + 18, h + 18, w * .16, C.ink);
  rrect(-w / 2, -h / 2, w, h, w * .14, '#050506', '#3a3d45', 4);
  const sx = -w / 2 + 16, sy = -h / 2 + 16, sw = w - 32, sh = h - 32;
  ctx.save(); ctx.beginPath(); ctx.roundRect(sx, sy, sw, sh, w * .11); ctx.clip();
  ctx.fillStyle = C.dark; ctx.fillRect(sx, sy, sw, sh);
  ctx.translate(sx, sy); content(sw, sh);
  ctx.restore();
  rrect(-w * .12, -h / 2 + 26, w * .24, 28, 14, '#000');
  ctx.restore();
}

function rays(x, y, r, n, rot, color, a) {
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const a0 = rot + i * TAU / n, a1 = a0 + TAU / n / 2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a0) * r, y + Math.sin(a0) * r); ctx.lineTo(x + Math.cos(a1) * r, y + Math.sin(a1) * r); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function pill(x, y, label, color, textColor, size = 48, scale = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.font = `900 ${size}px ${FONT}`;
  const w = ctx.measureText(label).width + size * 1.1, h = size * 1.6;
  rrect(-w / 2, -h / 2, w, h, h / 2, color, C.ink, 7);
  text(label, 0, 2, size, textColor, { stroke: false });
  ctx.restore();
}

// ---------- dragon ----------
function wing(bx, by, f, col) {
  const el = [bx + 110, by - 260 + f * 40], tip = [bx + 240, by - 470 + f * 90];
  const s1 = [bx + 330, by - 250 + f * 60], s2 = [bx + 270, by - 110 + f * 20], s3 = [bx + 170, by - 60];
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(el[0], el[1]); ctx.lineTo(tip[0], tip[1]);
  ctx.quadraticCurveTo(s1[0] - 10, s1[1] - 60, s1[0], s1[1]);
  ctx.quadraticCurveTo(s1[0] - 70, s1[1] + 40, s2[0], s2[1]);
  ctx.quadraticCurveTo(s2[0] - 60, s2[1] + 10, s3[0], s3[1]);
  ctx.quadraticCurveTo(s3[0] - 60, by + 10, bx, by);
  paint(col, C.ink, 8);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 5;
  for (const s of [s1, s2, s3]) { ctx.beginPath(); ctx.moveTo(el[0], el[1]); ctx.lineTo(s[0], s[1]); ctx.stroke(); }
  line([[bx, by], el, tip], 14, C.ink);
}

function dragonHead(jaw, dead, t) {
  ctx.save(); ctx.translate(-250, -590);
  poly([[30, -50], [120, -150], [80, -40]], C.horn, C.ink, 7);
  poly([[-20, -60], [30, -175], [40, -55]], C.horn, C.ink, 7);
  const ja = -jaw * .6, hinge = [40, 20];
  const tipX = hinge[0] + Math.cos(Math.PI + ja) * 230, tipY = hinge[1] + Math.sin(Math.PI + ja) * 230;
  poly([hinge, [-190, 20], [tipX, tipY + 20], [20, 50]], C.mouth);
  for (let x = -180; x < -40; x += 30) poly([[x, 18], [x + 14, 18], [x + 7, 40]], '#fff', C.ink, 3);
  ctx.save(); ctx.translate(hinge[0], hinge[1]); ctx.rotate(ja);
  for (let x = -215; x < -80; x += 34) poly([[x, 4], [x + 14, 4], [x + 7, -16]], '#fff', C.ink, 3);
  poly([[0, 0], [-235, 2], [-225, 30], [-150, 46], [-10, 42]], C.drag, C.ink, 8);
  ctx.restore();
  poly([[-200, -18], [-150, -50], [-40, -70], [40, -95], [112, -60], [122, 10], [40, 28], [-205, 22]], C.drag, C.ink, 8);
  ellipse(-172, -18, 9, 6, C.ink);
  if (dead) {
    line([[0, -62], [36, -26]], 9, C.ink); line([[36, -62], [0, -26]], 9, C.ink);
  } else {
    ellipse(18, -42, 30, 22, '#fff', C.ink, 6);
    ellipse(12, -42, 7, 15, '#e0242e');
    line([[-18, -60], [62, -86]], 12, C.ink);
  }
  if (!dead && jaw < .3) { // nostril smoke
    for (let i = 0; i < 3; i++) {
      const ph = (t * 1.2 + i / 3) % 1;
      circle(-190 - ph * 40, -30 - ph * 90, 10 + ph * 22, `rgba(160,160,170,${.5 * (1 - ph)})`);
    }
  }
  ctx.restore();
}

function drawDragon(o) {
  const t = o.t, f = Math.sin(t * 6);
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.tilt || 0); ctx.scale(o.s, o.s);
  ctx.globalAlpha *= o.alpha ?? 1;
  ellipse(40, 8, 260, 30, 'rgba(0,0,0,.3)');
  wing(130, -370, f, C.dragD);
  // tail
  const tail = () => { ctx.beginPath(); ctx.moveTo(180, -200); ctx.bezierCurveTo(360, -160, 380, -40, 520, -60); };
  ctx.lineCap = 'round';
  tail(); ctx.strokeStyle = C.ink; ctx.lineWidth = 86; ctx.stroke();
  tail(); ctx.strokeStyle = C.drag; ctx.lineWidth = 70; ctx.stroke();
  poly([[505, -100], [610, -78], [515, -22]], '#ffcf4d', C.ink, 7);
  limb([[170, -170], [190, -24]], 80, C.dragD, 8);
  for (const cx of [160, 190, 220]) poly([[cx - 8, -6], [cx + 8, -6], [cx, 10]], '#fff', C.ink, 4);
  // body
  for (let i = 0; i < 5; i++) { const a = -2.6 + i * .32; poly([[40 + Math.cos(a) * 205, -250 + Math.sin(a) * 148], [40 + Math.cos(a + .14) * 275, -250 + Math.sin(a + .14) * 205], [40 + Math.cos(a + .28) * 205, -250 + Math.sin(a + .28) * 148]], '#ffcf4d', C.ink, 6); }
  ellipse(40, -250, 220, 160, C.drag, C.ink, 8);
  ellipse(-20, -205, 140, 105, C.belly);
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 6;
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(-20, -330 + i * 45, 120, .6 * Math.PI, .9 * Math.PI, false); ctx.stroke(); }
  wing(30, -360, f * .9 + .2, C.drag);
  // front leg
  limb([[-70, -150], [-92, -24]], 86, C.drag, 8);
  for (const cx of [-130, -100, -70]) poly([[cx - 8, -6], [cx + 8, -6], [cx, 10]], '#fff', C.ink, 4);
  // neck
  const neck = () => { ctx.beginPath(); ctx.moveTo(-60, -320); ctx.bezierCurveTo(-140, -400, -210, -450, -215, -560); };
  neck(); ctx.strokeStyle = C.ink; ctx.lineWidth = 122; ctx.stroke();
  neck(); ctx.strokeStyle = C.drag; ctx.lineWidth = 106; ctx.stroke();
  dragonHead(o.jaw || 0, o.dead, t);
  ctx.restore();
}

function fireBreath(t, from, to, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const N = 80;
  for (let i = 0; i < N; i++) {
    const ph = (t * 2.4 + i / N) % 1;
    const wob = 40 * ph;
    const x = lerp(from[0], to[0], ph) + Math.sin(i * 1.7 + t * 20) * wob;
    const y = lerp(from[1], to[1], ph) + Math.cos(i * 2.3 + t * 17) * wob;
    const r = 14 + ph * 62;
    const col = ph < .25 ? '255,245,200' : ph < .6 ? '255,170,40' : '255,70,30';
    ctx.fillStyle = `rgba(${col},${a * (1 - ph * .6) * .5})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function shield(x, y, r, a, t) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(x, y, r * .5, x, y, r);
  g.addColorStop(0, 'rgba(198,255,61,0)'); g.addColorStop(1, 'rgba(198,255,61,.35)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.shadowColor = C.lime; ctx.shadowBlur = 30;
  ctx.strokeStyle = C.lime; ctx.lineWidth = 8 + Math.sin(t * 30) * 2;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.restore();
}

// ---------- scenes ----------
// 0–10.5: stuck in the gym, then a phone arrives
function scene12(t) {
  gym(t);
  wallClock(110, 475, t, t < 7.5 ? 3 : .2);

  const GX = 540, GY = 1700, GS = 1.35, drop = 6.2;
  const g = { x: GX, y: GY, s: GS, t, m: 0, pose: 'press', weight: 95, face: 'grit', sweat: true };
  if (t < drop) {
    const cyc = 1.55, ph = (t % cyc) / cyc;
    g.lift = ph < .45 ? eOut(ph / .45) * .5 : ph < .7 ? .5 : .5 * (1 - eIO((ph - .7) / .3));
    g.shake = ph > .4 && ph < .72 ? 7 : 0;
    g.bend = 6;
  } else {
    g.pose = 'hang'; g.weight = 0; g.face = 'sad'; g.sweat = false;
    g.slump = eOut(P(t, drop, drop + .5));
    if (t > 8.4) { g.face = 'wow'; g.lookUp = true; g.slump = lerp(1, .2, eOut(P(t, 8.4, 8.9))); }
  }

  // dimming when the phone shows up
  const dim = .5 * P(t, 7.6, 8.1);
  if (dim > 0) { ctx.fillStyle = `rgba(5,6,8,${dim})`; ctx.fillRect(-60, -60, W + 120, H + 120); }

  drawGuy(g);
  if (t >= drop) { // bar falls to the floor in front of him
    const k = eIn(P(t, drop, drop + .28));
    const fromY = GY - GS * 340, toY = GY - GS * 46 + 10;
    ctx.save(); ctx.translate(GX, lerp(fromY, toY, k)); ctx.scale(GS, GS);
    drawBarbell(0, 0, 95, { half: 164, rot: k < 1 ? 0 : 0 });
    ctx.restore();
  }

  rainCloud(GX + (t >= drop ? 10 : 0), 830 + Math.sin(t * 2) * 8, P(t, 2.8, 3.2) * (1 - P(t, 8.2, 8.6)), t);
  thoughtChart(800, 600, P(t, 4.3, 4.7) * (1 - P(t, 7.4, 7.7)), t);

  // captions
  const capA = 1 - P(t, 7.7, 8.0);
  if (capA > 0) {
    const steps = [[0, 1], [1.8, 3], [3.4, 6], [5, 12]];
    let ct = 0, n = 1; for (const [s, v] of steps) if (t >= s) { ct = s; n = v; }
    const pop = eBack(P(t, ct, ct + .3));
    text(`MONTH ${n}`, 540, 230, 130, '#fff', { scale: pop, alpha: capA * P(t, .1, .4) });
    let sub = n === 1 ? '95 LB' : 'STILL 95 LB.';
    if (t >= drop) sub = 'NOTHING WORKED.';
    text(sub, 540, 365, 68, n === 1 && t < drop ? C.lime : '#ff6b6b', { alpha: capA * P(t, .3, .6) });
  }

  // phone drop + zoom transition
  if (t > 7.9) {
    const zoom = eIn(P(t, 9.7, 10.5));
    const py = lerp(lerp(-400, 760, eBounce(P(t, 7.9, 8.8))), 960, zoom);
    rays(540, py, 900, 14, t * .6, C.lime, .16 * P(t, 8.2, 8.7) * (1 - zoom));
    phone(540, py, 300, 520, 1 + zoom * 8, (sw, sh) => {
      const glow = ctx.createRadialGradient(sw / 2, sh / 2, 10, sw / 2, sh / 2, sw);
      glow.addColorStop(0, 'rgba(198,255,61,.25)'); glow.addColorStop(1, 'rgba(198,255,61,0)');
      ctx.fillStyle = glow; ctx.fillRect(0, 0, sw, sh);
      logo(sw / 2, sh / 2 - 30, 170, P(t, 8.4, 9.2));
      text('Fits', sw / 2, sh / 2 + 80, 54, '#fff', { stroke: false, alpha: P(t, 8.9, 9.2) });
    });
    const capB = P(t, 8.3, 8.6) * (1 - zoom);
    text('UNTIL HE GOT', 540, 230, 96, '#fff', { alpha: capB, scale: eBack(P(t, 8.3, 8.6)) });
    text('FITS', 540, 360, 130, C.lime, { alpha: P(t, 8.6, 8.9) * (1 - zoom), scale: eBack(P(t, 8.6, 8.9)) });
  }
}

// 10.5–19.5: the grind montage
const T3 = 10.9, REP = .7;
const WTS = [95, 105, 105, 115, 125, 125, 135, 155, 165, 185, 205, 225];
const isPR = WTS.map((w, i) => i === 0 || w > Math.max(...WTS.slice(0, i)));

function appScreen(sw, sh, t) {
  const done = WTS.filter((_, i) => T3 + (i + .5) * REP <= t).length;
  const week = 1 + Math.floor(done * 15 / 12);
  const curW = done ? WTS[done - 1] : 95;
  logo(48, 54, 70);
  text('Fits', 92, 54, 36, '#fff', { stroke: false, align: 'left', font: UI, weight: 800 });
  rrect(sw - 176, 32, 156, 46, 23, '#23262d');
  text(`WEEK ${week}`, sw - 98, 56, 22, C.lime, { stroke: false });
  text('Overhead Press', 24, 124, 38, '#fff', { stroke: false, align: 'left', font: UI, weight: 800 });

  const rows = [];
  for (let i = 0; i < done; i++) rows.push({ i, w: WTS[i], pr: isPR[i], age: P(t, T3 + (i + .5) * REP, T3 + (i + .5) * REP + .25) });
  rows.slice(-4).forEach((r, j) => {
    const y = 162 + j * 76, slide = (1 - eOut(r.age)) * sw;
    ctx.save(); ctx.translate(slide, 0);
    rrect(20, y, sw - 40, 62, 16, '#1c1f25');
    text(`Set ${r.i + 1}`, 42, y + 31, 22, '#8b919c', { stroke: false, align: 'left', font: UI, weight: 700 });
    text(`${r.w} lb × 5`, 130, y + 31, 30, '#fff', { stroke: false, align: 'left', font: UI, weight: 800 });
    if (r.pr) { rrect(sw - 150, y + 15, 58, 32, 10, C.lime); text('PR', sw - 121, y + 32, 20, C.dark, { stroke: false }); }
    circle(sw - 54, y + 31, 18, C.lime);
    line([[sw - 63, y + 31], [sw - 56, y + 38], [sw - 44, y + 24]], 5, C.dark);
    ctx.restore();
  });

  // progress chart
  const cy0 = 480, ch = 230;
  rrect(20, cy0, sw - 40, ch, 20, '#1c1f25');
  const pct = Math.round(lerp(23, 81, (curW - 95) / 130));
  text(`Stronger than ${pct}% of lifters`, 40, cy0 + 34, 22, C.lime, { stroke: false, align: 'left', font: UI, weight: 800 });
  const px = i => 50 + i * (sw - 100) / 11, py = w => cy0 + ch - 30 - (w - 95) / 130 * (ch - 100);
  ctx.strokeStyle = '#2a2e36'; ctx.lineWidth = 2;
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(40, cy0 + 80 + k * 55); ctx.lineTo(sw - 40, cy0 + 80 + k * 55); ctx.stroke(); }
  const pts = rows.map(r => [px(r.i), py(r.w)]);
  if (pts.length > 1) line(pts, 7, C.lime);
  pts.forEach(p => circle(p[0], p[1], 7, C.lime));
}

function scene3(t) {
  gym(t, { top: '#26302a', bot: '#1a201c' });
  rays(540, 1450, 1600, 20, t * .25, C.lime, .05 + .03 * Math.sin(t * 9));

  const i = Math.floor((t - T3) / REP), ph = ((t - T3) / REP) % 1;
  const repping = t >= T3 && i < WTS.length;
  const lift = repping ? Math.pow(Math.sin(Math.PI * ph), .8) : 0;
  const curW = WTS[clamp(i, 0, WTS.length - 1)];
  const m = eIO(P(t, T3, T3 + REP * WTS.length));

  drawGuy({ x: 540, y: 1790, s: 1.1, t, m, pose: 'press', lift, weight: curW, face: lift > .6 ? 'grit' : 'determined', shirt: C.lime, band: true, bob: Math.sin(t * 3) * 3 });

  // PR pops
  WTS.forEach((w, k) => {
    if (!isPR[k] || k === 0) return;
    const ct = T3 + (k + .5) * REP, age = (t - ct) / .6;
    if (age < 0 || age >= 1) return;
    const side = k % 2 ? 1 : -1, sc = eBack(clamp(age * 3)), a = 1 - P(age, .7, 1);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(540 + side * 330, 1180); ctx.scale(sc, sc);
    burst(0, 0, 100, 10, C.lime, age * 2);
    text('PR!', 0, 4, 58, C.dark, { stroke: false });
    ctx.restore();
  });

  const wPop = repping ? eBack(clamp(ph * 4)) : 1;
  pill(540, 1060, `${curW} LB`, '#fff', C.dark, 46, lerp(.9, 1, wPop));

  phone(540, 590, 500, 780, 1, (sw, sh) => appScreen(sw, sh, t));

  const capA = t < 15 ? P(t, 10.8, 11.1) * (1 - P(t, 14.7, 14.9)) : P(t, 15, 15.3);
  const cap = t < 15 ? 'LOG EVERY SET.' : 'WATCH IT CLIMB.';
  text(cap, 540, 110, 84, '#fff', { alpha: capA, scale: eBack(P(t, t < 15 ? 10.8 : 15, t < 15 ? 11.1 : 15.3)) });
}

// 19.5–27.5: boss fight
const DX = 830, DY = 1500, DS = .85, GX4 = 255, GY4 = 1760;
function scene4(t) {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#1d0a26'); sky.addColorStop(.6, '#6b1a24'); sky.addColorStop(1, '#2a0d10');
  ctx.fillStyle = sky; ctx.fillRect(-60, -60, W + 120, H + 120);
  circle(760, 560, 170, '#ff8a3d'); circle(760, 560, 130, '#ffb86b');
  poly([[-60, 1300], [120, 1050], [260, 1200], [420, 980], [600, 1250], [760, 1100], [1140, 1320], [1140, 1700], [-60, 1700]], '#3a1220');
  // embers
  for (let i = 0; i < 30; i++) {
    const ph = (t * .25 + hash(i)) % 1;
    circle(hash(i + 9) * W + Math.sin(t * 2 + i) * 20, H - ph * H, 4 + hash(i + 3) * 5, `rgba(255,${120 + hash(i) * 100 | 0},60,${.8 * (1 - ph)})`);
  }
  ctx.fillStyle = '#1b0b0e'; ctx.fillRect(-60, 1620, W + 120, H);
  ctx.strokeStyle = 'rgba(255,90,40,.5)'; ctx.lineWidth = 5;
  for (const [x, y] of [[80, 1700], [420, 1840], [300, 1660]]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 60, y + 20); ctx.lineTo(x + 110, y + 5); ctx.stroke(); }
  poly([[560, 1520], [600, 1490], [700, 1500], [800, 1485], [940, 1500], [1140, 1490], [1140, H + 60], [520, H + 60]], '#2b1418', C.ink, 8);

  // dragon state
  const land = eIn(P(t, 19.6, 20.6));
  const jaw = t < 20.8 ? .1 : t < 21.6 ? eOut(P(t, 20.8, 21.1)) : t < 22.8 ? .9 : t < 24.5 ? lerp(.9, .15, P(t, 22.8, 23.1)) : .8;
  const tilt = eIn(P(t, 24.7, 25.6)) * .9 + (t > 24.5 && t < 24.9 ? Math.sin(t * 80) * .03 : 0);
  const dAlpha = 1 - P(t, 25.5, 25.85);
  if (dAlpha > 0) drawDragon({ x: DX, y: DY - (1 - land) * 1700, s: DS, t, jaw, tilt, dead: t > 24.5, alpha: dAlpha });

  // poof
  if (t > 25.4 && t < 26.8) {
    const k = P(t, 25.4, 26.8);
    for (let i = 0; i < 12; i++) {
      const a = i * TAU / 12 + hash(i);
      circle(DX + Math.cos(a) * 260 * eOut(k), DY - 260 + Math.sin(a) * 200 * eOut(k), (60 + hash(i + 4) * 40) * (1 - k * .6), `rgba(200,200,215,${.85 * (1 - k)})`);
    }
  }

  // hero state
  const g = { x: GX4, y: GY4, s: 1, t, m: 1, pose: 'press', lift: 0, weight: 225, face: 'determined', shirt: C.lime, band: true, bob: Math.sin(t * 3) * 3 };
  if (t > 21.6 && t < 22.8) g.face = 'grit';
  if (t >= 22.8) { g.lift = eIO(P(t, 22.8, 23.6)); g.face = 'grit'; g.shake = t < 23.6 ? 3 : 0; }
  if (t >= 23.8) { g.pose = 'throw'; g.weight = 0; g.face = 'determined'; }
  if (t >= 25.2) { g.pose = 'flex'; g.face = 'happy'; }
  drawGuy(g);

  // fire hitting the shield
  const mouth = [DX - 450 * DS, DY - 572 * DS], SC = [GX4, GY4 - 260], SR = 250;
  const dir = [mouth[0] - SC[0], mouth[1] - SC[1]], dl = Math.hypot(dir[0], dir[1]);
  const edge = [SC[0] + dir[0] / dl * SR, SC[1] + dir[1] / dl * SR];
  const fireA = P(t, 21.6, 21.8) * (1 - P(t, 22.6, 22.8));
  shield(SC[0], SC[1], SR, P(t, 21.4, 21.6) * (1 - P(t, 22.8, 23.1)), t);
  fireBreath(t, mouth, edge, fireA);

  // thrown barbell
  if (t >= 23.8 && t < 24.55) {
    const k = P(t, 23.8, 24.5);
    const from = [GX4, GY4 - 520], to = [DX - 310 * DS, DY - 610 * DS];
    const x = lerp(from[0], to[0], k), y = lerp(from[1], to[1], k) - Math.sin(Math.PI * k) * 320;
    drawBarbell(x, y, 225, { half: 150, rot: k * TAU * 2.5 });
  }
  if (t >= 24.5 && t < 25.3) {
    const k = P(t, 24.5, 25.3), hx = DX - 310 * DS, hy = DY - 610 * DS;
    ctx.save(); ctx.globalAlpha = 1 - k;
    burst(hx, hy, 160 + k * 120, 12, '#fff3a0', k);
    burst(hx, hy, 90 + k * 60, 9, '#ff8a3d', -k);
    text('BONK!', hx, hy, 70, '#fff', { rot: -.15 });
    ctx.restore();
  }

  // UI
  const hp = 1 - eOut(P(t, 24.5, 25.1));
  const barA = P(t, 20.5, 20.8) * (1 - P(t, 25.6, 26));
  if (barA > 0) {
    ctx.save(); ctx.globalAlpha = barA;
    text('BOSS: THE PLATEAU', 540, 118, 58, '#fff');
    rrect(90, 170, 900, 52, 26, '#2a0d12', C.ink, 8);
    if (hp > 0) rrect(98, 178, 884 * hp, 36, 18, hp > .3 ? '#ff4d4d' : '#ffb347');
    ctx.restore();
  }
  if (t > 20.7 && t < 21.9) {
    const k = P(t, 20.7, 21.9);
    text('BOSS FIGHT!', 540, 470, 120, '#ffcf4d', { scale: eBack(clamp(k * 4)), alpha: 1 - P(k, .8, 1), rot: -.05 });
  }
  if (t > 25.2) {
    const k = P(t, 25.2, 25.5);
    text('PLATEAU', 540, 450, 140, '#fff', { scale: eBack(k), rot: -.04 });
    text('BROKEN!', 540, 600, 150, C.lime, { scale: eBack(P(t, 25.35, 25.65)), rot: -.04 });
    for (let i = 0; i < 90; i++) {
      const tt = t - 25.2, y = -40 + tt * (380 + hash(i + 5) * 420) - hash(i + 2) * 500;
      if (y < -40) continue;
      const x = hash(i) * W + Math.sin(tt * 3 + i) * 40;
      ctx.save(); ctx.translate(x, y); ctx.rotate(tt * (3 + hash(i) * 6));
      ctx.fillStyle = [C.lime, '#fff', '#ff4d4d', '#3d7bd6', '#ffcf4d'][i % 5]; ctx.fillRect(-11, -6, 22, 12);
      ctx.restore();
    }
  }
}

// 27.5–31: end card
function scene5(t) {
  ctx.fillStyle = C.dark; ctx.fillRect(-60, -60, W + 120, H + 120);
  const g = ctx.createRadialGradient(540, 820, 50, 540, 820, 700);
  g.addColorStop(0, `rgba(198,255,61,${.16 * P(t, 27.8, 28.6)})`); g.addColorStop(1, 'rgba(198,255,61,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  logo(540, 780, 380, P(t, 27.7, 28.6));
  const a1 = P(t, 28.3, 28.7), a2 = P(t, 28.7, 29.1), a3 = P(t, 29, 29.4), a4 = P(t, 29.4, 29.8);
  text('Fits', 540, 1040 + (1 - eOut(a1)) * 40, 210, '#fff', { stroke: false, alpha: a1, font: UI, weight: 900 });
  text('Break your plateau.', 540, 1210 + (1 - eOut(a2)) * 30, 72, C.lime, { stroke: false, alpha: a2, font: UI, weight: 800 });
  text('Log every set. Beat every PR.', 540, 1300 + (1 - eOut(a3)) * 30, 42, '#9aa0aa', { stroke: false, alpha: a3, font: UI, weight: 600 });
  ctx.save(); ctx.globalAlpha = a4;
  rrect(290, 1520, 500, 120, 60, C.lime);
  text('Download Fits', 540, 1582, 50, C.dark, { stroke: false, font: UI, weight: 900 });
  ctx.restore();
}

function shakeAmt(t) {
  let s = 0;
  for (const [t0, amp] of [[6.48, 16], [20.6, 34], [24.5, 44]]) if (t >= t0) s += amp * Math.exp(-(t - t0) * 6);
  if (t > 20.9 && t < 21.6) s += 9;
  return s;
}

function renderAt(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  const s = shakeAmt(t);
  ctx.save(); ctx.translate(Math.sin(t * 93.1) * s, Math.cos(t * 71.7) * s);
  if (t < 10.5) scene12(t); else if (t < 19.5) scene3(t); else if (t < 27.5) scene4(t); else scene5(t);
  ctx.restore();

  // transitions
  const darkA = Math.max(t >= 10.5 && t < 11 ? 1 - P(t, 10.5, 10.85) : 0, t > 27 && t < 27.5 ? P(t, 27, 27.5) : 0, t >= 27.5 ? 1 - P(t, 27.5, 27.8) : 0, P(t, 30.4, 31));
  const whiteA = Math.max(t < 19.5 ? P(t, 19.3, 19.5) : 1 - P(t, 19.5, 19.9), t >= 24.5 && t < 24.7 ? 1 - P(t, 24.5, 24.7) : 0);
  if (whiteA > 0) { ctx.fillStyle = `rgba(255,255,255,${whiteA})`; ctx.fillRect(0, 0, W, H); }
  if (t < 27.5 || t > 27.8) {
    const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .75);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
  if (darkA > 0) { ctx.fillStyle = `rgba(17,18,20,${darkA})`; ctx.fillRect(0, 0, W, H); }
  // fade in from black at start
  if (t < .4) { ctx.fillStyle = `rgba(0,0,0,${1 - t / .4})`; ctx.fillRect(0, 0, W, H); }
}

window.FPS = FPS; window.DUR = DUR; window.renderAt = renderAt;

// ---------- preview player ----------
if (new URLSearchParams(location.search).has('render')) {
  document.body.classList.add('render');
  renderAt(0);
} else {
  const btn = document.getElementById('play'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
  const songIn = document.getElementById('song'), offIn = document.getElementById('off');
  const audio = new Audio(); let hasSong = false, playing = false, cur = 0, last = 0;
  songIn.onchange = () => { const f = songIn.files[0]; if (f) { audio.src = URL.createObjectURL(f); hasSong = true; } };
  const off = () => parseFloat(offIn.value) || 0;
  const show = () => { renderAt(cur); scrub.value = cur; timeEl.textContent = cur.toFixed(2) + 's'; };
  btn.onclick = () => {
    playing = !playing; btn.textContent = playing ? 'Pause' : 'Play';
    if (cur >= DUR) cur = 0;
    if (hasSong) { if (playing) { audio.currentTime = off() + cur; audio.play(); } else audio.pause(); }
    last = performance.now();
  };
  scrub.oninput = () => { cur = parseFloat(scrub.value); if (hasSong) audio.currentTime = off() + cur; show(); };
  const loop = now => {
    if (playing) {
      cur = hasSong && !audio.paused ? audio.currentTime - off() : cur + (now - last) / 1000;
      if (cur >= DUR) { cur = DUR; playing = false; btn.textContent = 'Play'; audio.pause(); }
      show();
    }
    last = now; requestAnimationFrame(loop);
  };
  show(); requestAnimationFrame(loop);
}
</script>
