<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fits Kaizo Promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #0b0b0c; color: #ddd; font: 14px system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; }
  canvas { height: calc(100vh - 90px); aspect-ratio: 9 / 16; background: #000; border-radius: 12px; }
  #ui { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  body.render #ui { display: none; }
  body.render #wrap { padding: 0; }
  body.render canvas { height: auto; width: 1080px; border-radius: 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="ui">
    <button id="play">Play</button>
    <input id="scrub" type="range" min="0" max="40" step="0.01" value="0" style="width:320px">
    <span id="time">0.00s</span>
    <label>Song <input id="song" type="file" accept="audio/*"></label>
    <label>Song start (s) <input id="off" type="number" value="0" step="0.1" style="width:64px"></label>
  </div>
</div>
<script>
const W = 1080, H = 1920, FPS = 30, DUR = 40;
const out = document.getElementById('c'), octx = out.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const bctx = buf.getContext('2d');
let ctx = bctx;
let T = 0, BS = 0, PID = 0, FX = {};
const TAU = Math.PI * 2;
const INK = '#2a1a2e';
const PX = '"Press Start 2P", monospace';
const TOON = '"Lilita One", "Arial Black", sans-serif';
const UI = '"Segoe UI", system-ui, sans-serif';
const LIME = '#c6ff3d';
// key light from the top-left; optional coloured rim light from the right
const L = { sx: 15, sy: 13, lx: 5, ly: 5, rim: null };

// ---------- math ----------
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const eElastic = x => x === 0 || x === 1 ? x : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * TAU / 3) + 1;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1]], sub: (a, b) => [a[0] - b[0], a[1] - b[1]],
  mul: (a, k) => [a[0] * k, a[1] * k], mix: (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)],
  len: a => Math.hypot(a[0], a[1]), norm: a => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; },
};
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mixHex(a, b, k) { const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], k)).toString(16).padStart(2, '0')).join(''); }
function mixMat(a, b, k) { return { b: mixHex(a.b, b.b, k), s: mixHex(a.s, b.s, k), l: mixHex(a.l, b.l, k) }; }

// ---------- materials ----------
const M = {
  skin: { b: '#f6c09d', s: '#d98d70', l: '#ffe3d1' }, flush: { b: '#f47a6c', s: '#c9504c', l: '#ffb0a0' },
  hair: { b: '#3b2820', s: '#22150e', l: '#634639' }, grey: { b: '#7d8aa3', s: '#58627a', l: '#a9b5ca' },
  lime: { b: '#c6ff3d', s: '#89bf17', l: '#f0ffc6' }, shorts: { b: '#2f3a66', s: '#1d2547', l: '#4a5b94' },
  shoe: { b: '#f6f6f8', s: '#c5c8d4', l: '#ffffff' }, wood: { b: '#cf9057', s: '#9f6336', l: '#ecb986' },
  metal: { b: '#aeb6c2', s: '#6f7783', l: '#eef2f7' }, dark: { b: '#34363f', s: '#1f2027', l: '#555864' },
  pad: { b: '#3d2232', s: '#24121d', l: '#5e3a4e' }, rubber: { b: '#2e3038', s: '#1b1c22', l: '#4b4e59' },
};

// ---------- path engine: smooth closed splines with cel shading ----------
function trace(pts, ox = 0, oy = 0) {
  const n = pts.length;
  ctx.moveTo(pts[0][0] + ox, pts[0][1] + oy);
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    let c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    let c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    if (p1[2]) { c1x = p1[0]; c1y = p1[1]; }
    if (p2[2]) { c2x = p2[0]; c2y = p2[1]; }
    ctx.bezierCurveTo(c1x + ox, c1y + oy, c2x + ox, c2y + oy, p2[0] + ox, p2[1] + oy);
  }
  ctx.closePath();
}
function boil(pts, amp) {
  const id = PID++;
  if (!amp) return pts;
  return pts.map((p, i) => [p[0] + (hash(i * 7.13 + id * 31.7 + BS * 1.3) - .5) * amp * 2, p[1] + (hash(i * 3.71 + id * 17.3 + BS * 2.1 + 5) - .5) * amp * 2, p[2]]);
}
function paint(pts, m, o = {}) {
  const Pp = boil(pts, o.boil ?? 1.4), k = o.k ?? 1;
  ctx.beginPath(); trace(Pp); ctx.fillStyle = m.b; ctx.fill();
  if (!o.flat) {
    ctx.save(); ctx.beginPath(); trace(Pp); ctx.clip();
    if (m.s) { ctx.beginPath(); trace(Pp); trace(Pp, -L.sx * k, -L.sy * k); ctx.fillStyle = m.s; ctx.fill('evenodd'); }
    if (m.l) { ctx.beginPath(); trace(Pp); trace(Pp, L.lx * k, L.ly * k); ctx.fillStyle = m.l; ctx.fill('evenodd'); }
    if (L.rim && !o.noRim) { ctx.beginPath(); trace(Pp); trace(Pp, -7 * k, 2 * k); ctx.fillStyle = L.rim; ctx.fill('evenodd'); }
    ctx.restore();
  }
  if (o.line !== false) { ctx.beginPath(); trace(Pp); ctx.lineWidth = o.lw || 5; ctx.strokeStyle = o.lineColor || INK; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function ellipsePts(cx, cy, rx, ry, n = 12, rot = 0) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    pts.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]);
  }
  return pts;
}
// tapered limb outline between two joints, with optional muscle bulges on each side
function capsule(a, b, wa, wb, bL = 0, bR = 0, at = .42, n = 6) {
  const d = V.sub(b, a), len = V.len(d) || 1, u = [d[0] / len, d[1] / len], nn = [-u[1], u[0]];
  const g = t => Math.exp(-((t - at) ** 2) / .045);
  const pts = [];
  for (let i = 0; i <= n; i++) { const t = i / n, w = lerp(wa, wb, t) + bL * g(t); pts.push([a[0] + d[0] * t + nn[0] * w, a[1] + d[1] * t + nn[1] * w]); }
  pts.push([b[0] + u[0] * wb * .95, b[1] + u[1] * wb * .95]);
  for (let i = n; i >= 0; i--) { const t = i / n, w = lerp(wa, wb, t) + bR * g(t); pts.push([a[0] + d[0] * t - nn[0] * w, a[1] + d[1] * t - nn[1] * w]); }
  pts.push([a[0] - u[0] * wa * .95, a[1] - u[1] * wa * .95]);
  return pts;
}

// one continuous limb through three joints (shoulder-elbow-wrist or hip-knee-ankle), so joints have no seams
function limb3(a, b, c, wa, wb, wc, bA = [0, 0], bB = [0, 0], n = 5) {
  const left = [], right = [];
  const segs = [[a, b, wa, wb, bA], [b, c, wb, wc, bB]];
  const nrm = (p, q) => { const u = V.norm(V.sub(q, p)); return [-u[1], u[0]]; };
  const n0 = nrm(a, b), n1 = nrm(b, c), nj = V.norm(V.add(n0, n1));
  segs.forEach(([p, q, w0, w1, bb], s) => {
    const d = V.sub(q, p), nn = s ? n1 : n0;
    for (let i = s ? 1 : 0; i <= n; i++) {
      const t = i / n, w = lerp(w0, w1, t), g = Math.exp(-((t - .45) ** 2) / .05);
      const N = (s === 0 && i === n) ? nj : nn, pt = V.add(p, V.mul(d, t));
      left.push(V.add(pt, V.mul(N, w + bb[0] * g))); right.push(V.sub(pt, V.mul(N, w + bb[1] * g)));
    }
  });
  const uE = V.norm(V.sub(c, b)), uS = V.norm(V.sub(b, a));
  return [...left, V.add(c, V.mul(uE, wc * .95)), ...right.reverse(), V.sub(a, V.mul(uS, wa * .95))];
}

// ---------- 2d helpers ----------
function circle(x, y, r, fill, stroke, lw = 5) { ctx.beginPath(); ctx.arc(x, y, Math.max(.1, r), 0, TAU); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function rrect(x, y, w, h, r, fill, stroke, lw = 5) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke(); } }
function stroke(pts, w, color, cap = 'round') { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.lineCap = cap; ctx.lineJoin = 'round'; ctx.lineWidth = w; ctx.strokeStyle = color; ctx.stroke(); }
function text(s, x, y, size, color, o = {}) {
  ctx.save(); ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  if (o.scale != null) ctx.scale(o.scale, o.scale);
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.font = `${o.weight || 400} ${size}px ${o.font || TOON}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.shadow) { ctx.fillStyle = o.shadow; ctx.fillText(s, size * .09, size * .11); }
  if (o.sw) { ctx.lineJoin = 'round'; ctx.strokeStyle = o.strokeColor || INK; ctx.lineWidth = size * o.sw; ctx.strokeText(s, 0, 0); }
  ctx.fillStyle = color; ctx.fillText(s, 0, 0);
  ctx.restore();
}
// retro game text
function px(s, x, y, size, color, o = {}) {
  text(s, x, y, size, color, Object.assign({ font: PX, sw: .32, strokeColor: '#000', shadow: 'rgba(0,0,0,.8)' }, o));
}
function gshadow(x, y, rx, a = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1, .2);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(8,4,16,${.5 * a})`); g.addColorStop(1, 'rgba(8,4,16,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, TAU); ctx.fill(); ctx.restore();
}
function ik(sh, ha, a, b, prefer) {
  const d = V.sub(ha, sh), dist = clamp(V.len(d), 1, a + b - .5), ang = Math.atan2(d[1], d[0]);
  const A = Math.acos(clamp((a * a + dist * dist - b * b) / (2 * a * dist), -1, 1));
  const e1 = [sh[0] + Math.cos(ang + A) * a, sh[1] + Math.sin(ang + A) * a], e2 = [sh[0] + Math.cos(ang - A) * a, sh[1] + Math.sin(ang - A) * a];
  const s1 = (e1[0] - sh[0]) * prefer[0] + (e1[1] - sh[1]) * prefer[1], s2 = (e2[0] - sh[0]) * prefer[0] + (e2[1] - sh[1]) * prefer[1];
  return s1 > s2 ? e1 : e2;
}

// ---------- character ----------
const STAND = {
  hip: [0, -255], chest: [0, -405], head: [0, -548],
  lSh: [-60, -412], lEl: [-84, -322], lHa: [-92, -235], rSh: [60, -412], rEl: [84, -322], rHa: [92, -235],
  lKn: [-38, -128], lFt: [-48, 0], rKn: [38, -128], rFt: [48, 0],
  face: 'neutral', m: 0, belly: 0, hr: 0, lx: 0, ly: 0, tw: 1, flex: 0, red: 0, pea: 0,
};
const pose = o => Object.assign({}, STAND, o);
function mixPose(a, b, k) {
  const o = {};
  for (const key of new Set([...Object.keys(a), ...Object.keys(b)])) {
    const va = a[key] ?? b[key], vb = b[key] ?? va;
    if (Array.isArray(va)) o[key] = V.mix(va, vb, k);
    else if (typeof va === 'number') o[key] = lerp(va, vb, k);
    else o[key] = k < .5 ? va : vb;
  }
  return o;
}
function track(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, p0] = keys[i], [t1, p1, e] = keys[i + 1];
    if (t <= t1) return mixPose(p0, p1, (e || eIO)(clamp((t - t0) / (t1 - t0))));
  }
  return keys[keys.length - 1][1];
}
const FLEX = { lEl: [-165, -440], lHa: [-140, -575], rEl: [165, -440], rHa: [140, -575], flex: 1 };
const ITEMGET = { lEl: [-100, -570], lHa: [-38, -705], rEl: [100, -570], rHa: [38, -705] };
const OVERHEAD = { lEl: [-150, -560], lHa: [-165, -705], rEl: [150, -560], rHa: [165, -705] };
const SIT = {
  hip: [0, -178], chest: [0, -328], head: [0, -470], lKn: [-62, -196], lFt: [-74, 0], rKn: [62, -196], rFt: [74, 0],
  lSh: [-58, -336], lEl: [-80, -258], lHa: [-24, -214], rSh: [58, -336], rEl: [96, -266], rHa: [64, -214],
};
const SLUMP = {
  hip: [0, -178], chest: [6, -300], head: [10, -402], hr: .18, ly: .9, lKn: [-64, -196], lFt: [-74, 0], rKn: [64, -196], rFt: [74, 0],
  lSh: [-50, -308], lEl: [-70, -232], lHa: [-22, -168], rSh: [58, -308], rEl: [80, -232], rHa: [26, -168], face: 'sad',
};
const LIE = {
  head: [-205, -178], chest: [-95, -162], hip: [55, -154], rSh: [-100, -196], lSh: [-100, -128], hr: -.12, tw: .62,
  lKn: [170, -214], lFt: [206, 0], rKn: [160, -204], rFt: [246, 0], armsFront: true,
};
const FLOOR = {
  head: [-215, -62], chest: [-105, -50], hip: [45, -44], rSh: [-108, -84], lSh: [-108, -18], tw: .6, hr: -.25, face: 'dead',
  rEl: [-40, -128], rHa: [20, -118], lEl: [-170, -6], lHa: [-232, -22], lKn: [160, -62], lFt: [262, -30], rKn: [150, -38], rFt: [252, -8], armsFront: true,
};

const HEAD = [[0, -104], [44, -98], [72, -66], [80, -18], [74, 30], [52, 66], [18, 84], [-18, 84], [-52, 66], [-74, 30], [-80, -18], [-72, -66], [-44, -98]];
const HAIR = [[-86, -20], [-98, -64, 1], [-78, -84], [-94, -124, 1], [-46, -112], [-36, -156, 1], [-2, -120], [24, -160, 1], [42, -114], [86, -132, 1], [76, -88], [106, -66, 1], [84, -24], [70, -56], [34, -70], [-4, -60], [-40, -72], [-68, -54]];

const FACES = {
  neutral: { eye: 'open', lid: [.12, 0], brow: [0, 0], mouth: 'flat' },
  determined: { eye: 'open', lid: [.42, .35], brow: [.45, 0], mouth: 'smirk' },
  strain: { eye: 'squeeze', brow: [.6, 0], mouth: 'grit' },
  shock: { eye: 'tiny', open: 1.2, brow: [-.6, 1], mouth: 'scream' },
  sad: { eye: 'open', lid: [.38, -.45], brow: [-.6, .3], mouth: 'frown' },
  happy: { eye: 'happy', brow: [-.3, .5], mouth: 'grin' },
  chew: { eye: 'happy', brow: [-.2, .2], mouth: 'chew', cheeks: 1 },
  dead: { eye: 'x', brow: [0, 0], mouth: 'tongue' },
  hope: { eye: 'sparkle', open: 1.15, brow: [-.45, .8], mouth: 'o' },
  smug: { eye: 'open', lid: [.5, -.1], brow: [.2, .3], mouth: 'smirk' },
  laugh: { eye: 'happy', brow: [-.3, .6], mouth: 'laugh' },
  look: { eye: 'open', lid: [.05, 0], brow: [-.2, .4], mouth: 'o' },
};

function drawEye(x, y, side, F, lx, ly) {
  ctx.save(); ctx.translate(x, y); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = INK;
  const inner = -side;
  if (F.eye === 'happy') {
    ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(0, 8, 14, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
  } else if (F.eye === 'squeeze') {
    ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-13 * inner, -11); ctx.lineTo(11 * inner, 0); ctx.lineTo(-13 * inner, 11); ctx.stroke();
  } else if (F.eye === 'x') {
    ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-12, -12); ctx.lineTo(12, 12); ctx.moveTo(12, -12); ctx.lineTo(-12, 12); ctx.stroke();
  } else {
    const open = F.open ?? 1, rx = 17, ry = 22 * open;
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.save(); ctx.clip();
    const ir = F.eye === 'tiny' ? 6 : 12.5, ix = lx * 6, iy = ly * 7 + 2;
    circle(ix, iy, ir, '#6b412c'); circle(ix, iy, ir * .55, '#120a0e');
    circle(ix - ir * .38, iy - ir * .42, ir * .34, '#fff');
    if (F.eye === 'sparkle') { circle(ix + ir * .45, iy + ir * .35, ir * .22, '#fff'); circle(ix - ir * .1, iy + ir * .5, ir * .14, '#fff'); }

      const yi = -ry + lid[0] * ry * 2 + lid[1] * ry * .7, yo = -ry + lid[0] * ry * 2 - lid[1] * ry * .7;
      ctx.beginPath(); ctx.moveTo(inner * (rx + 4), yi); ctx.lineTo(-inner * (rx + 4), yo); ctx.lineTo(-inner * (rx + 4), -ry - 6); ctx.lineTo(inner * (rx + 4), -ry - 6); ctx.closePath();
      ctx.fillStyle = M.skin.b; ctx.fill();
      ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(inner * rx, yi); ctx.lineTo(-inner * rx, yo); ctx.stroke();
    }
    ctx.restore();
    ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU); ctx.stroke();
    if (!(lid[0] > 0)) { ctx.lineWidth = 6.5; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke(); }
  }
  ctx.restore();
}
function drawMouth(type, x, y) {
  ctx.save(); ctx.translate(x, y); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = 5;
  const fillOutline = (fill) => { ctx.fillStyle = fill; ctx.fill(); ctx.stroke(); };
  if (type === 'flat') { ctx.beginPath(); ctx.moveTo(-15, 2); ctx.quadraticCurveTo(0, 4, 15, 0); ctx.stroke(); }
  else if (type === 'smirk') { ctx.beginPath(); ctx.moveTo(-17, 2); ctx.quadraticCurveTo(2, 9, 20, -6); ctx.stroke(); }
  else if (type === 'frown') { ctx.beginPath(); ctx.moveTo(-18, 10); ctx.quadraticCurveTo(-6, -6, 4, 0); ctx.quadraticCurveTo(12, -6, 18, 10); ctx.stroke(); }
  else if (type === 'o') { ctx.beginPath(); ctx.ellipse(0, 4, 9, 12, 0, 0, TAU); fillOutline('#5c1a2a'); }
  else if (type === 'grit') {
    ctx.beginPath(); ctx.roundRect(-28, -12, 56, 26, 9); fillOutline('#fff');
    ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-28, 1); ctx.lineTo(28, 1);
    for (const tx of [-14, 0, 14]) { ctx.moveTo(tx, -12); ctx.lineTo(tx, 14); }
    ctx.stroke();
  } else if (type === 'scream' || type === 'laugh' || type === 'grin') {
    ctx.beginPath();
    if (type === 'scream') ctx.ellipse(0, 12, 24, 32, 0, 0, TAU);
    else { ctx.moveTo(-32, -6); ctx.quadraticCurveTo(0, 2, 32, -6); ctx.quadraticCurveTo(28, type === 'laugh' ? 44 : 34, 0, type === 'laugh' ? 46 : 36); ctx.quadraticCurveTo(-28, type === 'laugh' ? 44 : 34, -32, -6); }
    ctx.fillStyle = '#5c1a2a'; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = '#fff'; ctx.fillRect(-40, type === 'scream' ? -24 : -10, 80, type === 'scream' ? 12 : 12);
    ctx.fillStyle = '#ff7b8a'; ctx.beginPath(); ctx.ellipse(0, type === 'scream' ? 40 : 36, 18, 12, 0, 0, TAU); ctx.fill();
    ctx.restore(); ctx.stroke();

    if (!powered) {

      ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(540, GY, 10, 540, GY, 360); g.addColorStop(0, 'rgba(198,255,61,.3)'); g.addColorStop(1, 'rgba(198,255,61,0)'); ctx.fillStyle = g; ctx.fillRect(140, GY - 300, 800, 500); ctx.restore();

    const standUp = pose({ face: 'hope', ly: -1 });
    const get = pose(Object.assign({}, ITEMGET, { face: 'happy' }));
    const p = track([[0, pose(Object.assign({}, SLUMP, { head: [6, -420], ly: -.3, hr: 0, face: 'look' }))], [.5, lookUp], [1.0, lookUp], [1.35, standUp, eBack], [1.5, get, eBack], [2.4, get], [2.7, pose(Object.assign({}, ITEMGET, { face: 'determined', m: .05 }))]], lt);
    drawGuy(p, 540, GY, S, { tank: powered ? M.lime : M.grey, band: powered });
    if (lt >= 1.5) {

    }

      phoneProp(540, phoneY, 190, 340, spin, (w, h) => fitsHome(w, h));
      for (let i = 0; i < 6; i++) sparkle(540 + (hash(i) - .5) * 300, phoneY + (hash(i + 4) - .5) * 400, .4 + .4 * Math.sin(T * 10 + i), T, LIME);

  if (!powered) { ctx.fillStyle = 'rgba(10,12,30,.25)'; ctx.fillRect(0, 0, W, H); }
  if (lt > 1.55 && lt < 2.4) { px('ITEM GET!', 540, 330, 66, '#fff', { scale: eBack(P(lt, 1.55, 1.75)) }); px('FITS', 540, 450, 96, LIME, { scale: eBack(P(lt, 1.7, 1.9)) }); }
  if (lt > 2.55) px("LET'S GO!", 540, 400, 72, LIME, { scale: eBack(P(lt, 2.55, 2.75)) });
  if (lt > 2.25 && lt < 2.6) FX.white = 1 - Math.abs(lt - 2.38) / .22;
}

function phoneShowcase(lt) {

}
function sSuccess(lt) {
  L.rim = 'rgba(198,255,61,.85)';

  const seg = segs.find(s => lt < s[1]) || segs[segs.length - 1];

  for (const s of segs) if (Math.abs(lt - s[0]) < .1 && s[0] > 0) FX.whip = (lt - s[0]) * 14;
  const cards = [[0, 'Bench Press', '155 lb × 5', 'PR'], [1.8, 'Bodyweight', '+12.4 lb', 'UP'], [3.5, 'Deadlift', '315 lb × 3', 'PR'], [5.2, 'Week 16', 'Top 22%', '★']];
  for (const [t0, a, b, c] of cards) if (lt > t0 + .3 && lt < t0 + 1.7) setCard(1500, a, b, c, P(lt, t0 + .3, t0 + .55) * (1 - P(lt, t0 + 1.5, t0 + 1.7)));
}

function sTrap(lt) {
  L.rim = 'rgba(198,255,61,.85)';
  const c = cam(540, lerp(1150, 1080, P(lt, 0, 3.5)), lerp(1.1, 1.0, P(lt, .9, 1.9)));

    let p, sq = 1;

    else { p = pose(Object.assign({}, OVERHEAD, { face: lt < 2.3 ? 'strain' : 'happy', m: 1 })); sq = 1 - .22 * Math.exp(-(lt - 1.9) * 7) * Math.cos((lt - 1.9) * 30); }
    if (caught) { cracksFloor(540, GY + 10, P(lt, 1.9, 2.2)); dust(540, GY, P(lt, 1.9, 2.6), 2, 12); }
    drawGuy(p, 540, GY, S, { tank: M.lime, band: true, sqy: sq, sqx: 2 - sq, shadow: false });
    const hy = caught ? GY - 705 * S * sq : lerp(-300, GY - 705 * S, eIn(fall));

  else if (lt < 1.9) px(Math.floor(lt * 6) % 2 ? '...WAIT' : '!!!', 540, 260, 70, '#ff4d5e');
  if (lt > 2.3) { px('TRAP CLEARED!', 540, 200, 60, LIME, { scale: eBack(P(lt, 2.3, 2.5)) }); px('NEW PR: 1000 LB', 540, 290, 40, '#fff', { scale: eBack(P(lt, 2.5, 2.7)) }); confetti(33 + 2.3); }
  if (caught) FX.shake = 46 * Math.exp(-(lt - 1.9) * 6);

function sEnd(lt) {
  ctx.fillStyle = '#111214'; ctx.fillRect(-100, -100, W + 200, H + 200);
  const g = ctx.createRadialGradient(540, 780, 50, 540, 780, 760);
  g.addColorStop(0, `rgba(198,255,61,${.18 * P(lt, .2, 1)})`); g.addColorStop(1, 'rgba(198,255,61,0)');

  ctx.save(); ctx.globalAlpha = a4; rrect(290, 1480, 500, 124, 62, LIME); text('Download Fits', 540, 1544, 52, '#111214', { font: UI, weight: 900 }); ctx.restore();
  if (lt > 2.3 && Math.floor(lt * 3) % 2 === 0) px('PRESS START', 540, 1760, 34, '#fff');
}

// ---------- timeline ----------
const SCENES = [
  { a: 0, b: 2, fn: sIntro },
  { a: 2, b: 5, fn: lt => benchScene(lt, false), death: { at: 4.35, txt: 'GAINS NOT FOUND', n: 1 } },
  { a: 5, b: 8, fn: lt => eatScene(lt, false), death: { at: 7.38, txt: 'ALL THAT FOOD\nFOR NOTHING', n: 2 } },
  { a: 8, b: 10.5, fn: lt => treadScene(lt, false), death: { at: 10.0, txt: 'DEATH BY CARDIO', n: 3 } },
  { a: 10.5, b: 13, fn: lt => deadScene(lt, false), death: { at: 12.47, txt: 'BAR: 1  YOU: 0', n: 4 } },
  { a: 13, b: 15, fn: lt => mirrorScene(lt, false), death: { at: 14.45, txt: 'SKILL ISSUE', n: 5 } },
  { a: 15, b: 18, fn: sMontage },
  { a: 18, b: 21.5, fn: sBottom },
  { a: 21.5, b: 24.5, fn: sItem },
  { a: 24.5, b: 33, fn: sSuccess },
  { a: 33, b: 36.5, fn: sTrap },
  { a: 36.5, b: 40, fn: sEnd },
];
const DEATHS = SCENES.filter(s => s.death).map(s => s.death);

// ---------- post + hud ----------
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const g = grain.getContext('2d'), id = g.createImageData(256, 256); for (let i = 0; i < id.data.length; i += 4) { const v = hash(i * .013) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); }

function hud(t, fx) {
  ctx = octx;
  if (t >= 2 && t < 18) {
    let n = 1, ct = 2;
    for (const d of DEATHS) if (t > d.at + .35) { n = d.n + 1; ct = d.at + .35; }
    if (t >= 15) { n = Math.round(lerp(6, 999, eIn(P(t, 15.1, 17.6)))); ct = t; }
    if (t < 15 || t >= 17.6) {
      px('TRY', 60, 110, 30, '#fff', { align: 'left' });
      px(String(n).padStart(3, '0'), 60, 170, 50, '#ffcf4d', { align: 'left', scale: t < 15 ? lerp(1.5, 1, eOut(P(t, ct, ct + .3))) : 1 });
      px('GAINS', 1020, 110, 30, '#fff', { align: 'right' });
      rrect(760, 145, 260, 40, 6, '#000', '#fff', 5);
    }
  }
  if (t >= 18 && t < 21.5) { px('TRY', 60, 110, 30, '#fff', { align: 'left' }); px('999', 60, 170, 50, '#ff4d5e', { align: 'left' }); }
  if (t >= 24.5 && t < 33) {
    const wk = 1 + Math.floor(P(t, 24.5, 31.2) * 15);
    px('WEEK', 60, 110, 30, '#fff', { align: 'left' }); px(String(wk).padStart(2, '0'), 60, 170, 50, LIME, { align: 'left' });
    px('GAINS', 1020, 110, 30, '#fff', { align: 'right' });
    rrect(760, 145, 260, 40, 6, '#000', '#fff', 5);
    rrect(766, 151, 248 * eIO(P(t, 24.5, 32)), 28, 3, LIME);
  }
  if (fx.death) {
    const d = fx.death, lines = d.txt.split('\n');
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 760, W, 120 + lines.length * 90);
    lines.forEach((ln, i) => px(ln, 540, 840 + i * 90, lines.length > 1 ? 50 : 56, '#ff4d5e', { scale: eBack(clamp(fx.k * 6)) }));
    if (Math.floor(t * 6) % 2 === 0) px('TRY AGAIN', 540, 860 + lines.length * 90, 36, '#fff');
  }
  if (fx.rewind != null) {
    ctx.fillStyle = '#fff';
    for (const dx of [0, 34]) { ctx.beginPath(); ctx.moveTo(110 + dx, 300); ctx.lineTo(80 + dx, 320); ctx.lineTo(110 + dx, 340); ctx.closePath(); ctx.fill(); }
    px('REWIND', 170, 322, 30, '#fff', { align: 'left' });
  }
  ctx = bctx;
}
function post(t, fx) {
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.globalAlpha = 1; octx.globalCompositeOperation = 'source-over'; octx.filter = 'none';
  octx.fillStyle = '#000'; octx.fillRect(0, 0, W, H);
  const sh = fx.shake || 0;
  octx.save(); octx.translate(Math.sin(t * 93.1) * sh, Math.cos(t * 71.7) * sh);
  if (sh) { octx.translate(540, 960); octx.scale(1 + sh / 500, 1 + sh / 500); octx.translate(-540, -960); }
  if (fx.rewind != null) {
    const n = 32;
    octx.filter = 'grayscale(.6) contrast(1.2) brightness(1.05)';
    for (let i = 0; i < n; i++) { const y0 = i * H / n, off = (hash(i + BS * 3.1) - .5) * 140 * (.4 + fx.rewind); octx.drawImage(buf, 0, y0, W, H / n, off, y0, W, H / n); }
    octx.filter = 'none';
  } else {
    octx.filter = fx.invert ? 'invert(1) hue-rotate(180deg)' : fx.gray ? 'grayscale(1) contrast(1.2) brightness(.85)' : 'saturate(1.08) contrast(1.04)';
    octx.drawImage(buf, 0, 0);
    octx.filter = 'none';
    if (fx.whip) { octx.globalAlpha = .16; for (let i = 1; i <= 7; i++) octx.drawImage(buf, fx.whip * i * 18, 0); octx.globalAlpha = 1; }
  }
  octx.restore();
  if (fx.gray && !fx.invert) { octx.fillStyle = 'rgba(150,10,40,.28)'; octx.fillRect(0, 0, W, H); }
  if (fx.gray || fx.rewind != null) { octx.fillStyle = 'rgba(0,0,0,.22)'; for (let y = 0; y < H; y += 6) octx.fillRect(0, y, W, 2); }
  if (fx.white) { octx.fillStyle = `rgba(255,255,255,${clamp(fx.white)})`; octx.fillRect(0, 0, W, H); }
  const v = octx.createRadialGradient(540, 960, 520, 540, 960, 1180);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.42)');
  octx.fillStyle = v; octx.fillRect(0, 0, W, H);
  octx.save(); octx.globalCompositeOperation = 'overlay'; octx.globalAlpha = .1;
  const ox = Math.floor(hash(BS) * 256), oy = Math.floor(hash(BS + 1) * 256);
  octx.fillStyle = octx.createPattern(grain, 'repeat'); octx.translate(-ox, -oy); octx.fillRect(0, 0, W + 256, H + 256);
  octx.restore();
}
function renderAt(t) {
  T = t; BS = Math.floor(t * 12); PID = 0; FX = {}; L.rim = null;
  const sc = SCENES.find(s => t < s.b) || SCENES[SCENES.length - 1];
  let st = t; const fx = {};
  if (sc.death && t >= sc.death.at) {
    const d = sc.death, k = (t - d.at) / (sc.b - d.at);
    if (k < .07) { st = d.at; fx.invert = true; }
    else if (k < .62) { st = d.at; fx.gray = true; fx.death = d; fx.k = (k - .07) / .55; }
    else { const k2 = (k - .62) / .38; st = lerp(d.at, sc.a, eIn(k2)); fx.rewind = k2; }
  }
  ctx = bctx; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.clearRect(0, 0, W, H);
  T = st;
  sc.fn(st - sc.a);
  T = t;
  if (fx.gray || fx.rewind != null) FX.shake = 0;
  Object.assign(fx, FX, fx.invert ? { invert: true } : {});
  post(t, fx);
  hud(t, fx);
  if (t < .35) { octx.fillStyle = `rgba(0,0,0,${1 - t / .35})`; octx.fillRect(0, 0, W, H); }
  if (t > 39.4) { octx.fillStyle = `rgba(0,0,0,${P(t, 39.4, 40)})`; octx.fillRect(0, 0, W, H); }
}

window.FPS = FPS; window.DUR = DUR; window.renderAt = renderAt;
window.READY = Promise.all([document.fonts.load('40px "Press Start 2P"'), document.fonts.load('40px "Lilita One"')]).catch(() => {});

// ---------- preview player ----------
if (new URLSearchParams(location.search).has('render')) {
  document.body.classList.add('render');
  window.READY.then(() => renderAt(0));
} else {
  const btn = document.getElementById('play'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
  const songIn = document.getElementById('song'), offIn = document.getElementById('off');
  const audio = new Audio(); let hasSong = false, playing = false, cur = 0, last = 0;
  songIn.onchange = () => { const f = songIn.files[0]; if (f) { audio.src = URL.createObjectURL(f); hasSong = true; } };
  const off = () => parseFloat(offIn.value) || 0;
  const show = () => { renderAt(cur); scrub.value = cur; timeEl.textContent = cur.toFixed(2) + 's'; };
  btn.onclick = () => {
    playing = !playing; btn.textContent = playing ? 'Pause' : 'Play';
    if (cur >= DUR) cur = 0;
    if (hasSong) { if (playing) { audio.currentTime = off() + cur; audio.play(); } else audio.pause(); }
    last = performance.now();
  };
  scrub.oninput = () => { cur = parseFloat(scrub.value); if (hasSong) audio.currentTime = off() + cur; show(); };
  const loop = now => {
    if (playing) {
      cur = hasSong && !audio.paused ? audio.currentTime - off() : cur + (now - last) / 1000;
      if (cur >= DUR) { cur = DUR; playing = false; btn.textContent = 'Play'; audio.pause(); }
      show();
    }
    last = now; requestAnimationFrame(loop);
  };
  window.READY.then(show); requestAnimationFrame(loop);
}
